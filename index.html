<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia đình Yêu Thương - AI Trợ Lý Gia Đình</title>
    <style>
        :root {
            --primary-color: #FF6B6B;
            --bg-color: #F7F9FC;
            --chat-bg: #FFFFFF;
            --user-msg-bg: #E3F2FD;
            --ai-msg-bg: #FFF3E0;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        /* Màn hình đăng nhập */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .avatar-house {
            font-size: 80px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Màn hình Chat */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #history-btn {
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            width: auto;
            margin: 0;
        }

        #chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border-bottom-left-radius: 2px;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 2px;
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
        }

        .message audio {
            margin-top: 5px;
        }

        #input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
            background: #fff;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #555;
            padding: 5px;
        }

        #file-input, #camera-input {
            display: none;
        }

        #mic-status {
            font-size: 12px;
            color: #888;
            margin-right: 10px;
        }

        /* Modal Lịch sử */
        #history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-height: 80%;
            overflow-y: auto;
        }

        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Màn hình Đăng nhập -->
    <div id="login-screen">
        <div class="avatar-house">🏠</div>
        <h2>Gia đình Yêu Thương</h2>
        <p>Trợ lý AI gia đình của bạn</p>
        
        <input type="text" id="username" placeholder="Tên của bạn">
        <select id="role">
            <option value="">Chọn chức danh trong gia đình</option>
            <option value="Bố">Bố</option>
            <option value="Mẹ">Mẹ</option>
            <option value="Chị hai">Chị hai</option>
            <option value="Anh hai">Anh hai</option>
            <option value="Em út">Em út</option>
        </select>
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="login()">Đăng nhập</button>
    </div>

    <!-- Màn hình Chat -->
    <div id="chat-screen">
        <header>
            <div class="user-info">
                <span>🏠</span>
                <div>
                    <strong id="display-name">Gia đình</strong>
                    <div style="font-size: 0.8em; opacity: 0.9;" id="display-role">Vai trò</div>
                </div>
            </div>
            <button id="history-btn" onclick="toggleHistory()">📜 Lịch sử</button>
        </header>

        <div id="chat-history">
            <!-- Tin nhắn sẽ hiện ở đây -->
            <div class="message ai">Chào mừng gia đình! Mình đã sẵn sàng lắng nghe và hỗ trợ mọi việc. Bạn cần gì không?</div>
        </div>

        <div id="input-area">
            <input type="file" id="file-input" accept="*" onchange="handleFileUpload()">
            <button class="action-btn" title="Tải tệp lên" onclick="document.getElementById('file-input').click()">📎</button>
            
            <input type="file" id="camera-input" accept="image/*" capture="user" onchange="handleImageCapture()">
            <button class="action-btn" title="Chụp ảnh" onclick="document.getElementById('camera-input').click()">📷</button>
            
            <button class="action-btn" id="mic-btn" title="Ghi âm & Tâm sự" onclick="toggleMic()">🎤</button>
            <span id="mic-status"></span>

            <input type="text" id="message-input" placeholder="Nhắn tin cho gia đình..." style="flex: 1; margin: 0;">
            <button onclick="sendMessage()" style="width: auto; margin: 0;">➤</button>
        </div>
    </div>
</div>

<!-- Modal Lịch sử -->
<div id="history-modal">
    <div class="modal-content">
        <span class="close-btn" onclick="toggleHistory()">&times;</span>
        <h3>Lịch sử trò chuyện</h3>
        <div id="history-list"></div>
    </div>
</div>

<script>
    let currentUser = {};
    let chatHistory = [];
    let isRecording = false;
    let mediaRecorder;
    let audioChunks = [];

    // Bước 1: Tạo tài khoản / Đăng nhập
    function login() {
        const name = document.getElementById('username').value;
        const role = document.getElementById('role').value;
        const pass = document.getElementById('password').value;

        if (!name || !role || !pass) {
            alert("Vui lòng điền đầy đủ thông tin: Tên, Chức danh và Mật khẩu.");
            return;
        }

        currentUser = { name, role, pass };
        
        // Cập nhật giao diện
        document.getElementById('display-name').innerText = name;
        document.getElementById('display-role').innerText = role;
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';

        // Chào mừng theo vai trò
        const greeting = `Chào ${role} ${name}, mình rất vui được gặp bạn hôm nay!
